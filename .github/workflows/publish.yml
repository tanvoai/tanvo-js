# Publishes to npm when a version tag (v0.1.0, …) is pushed, with provenance. Uses npm trusted publishing: no token
# is stored here. One-time setup on npmjs.com: package settings → Trusted publishing → GitHub Actions, this
# repository, workflow "publish.yml". (Before the first publish exists, publish 0.1.0 once by hand with `npm publish`.)
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm publish --provenance --access public
